<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Web EPG & Player</title>
    <!-- Include hls.js for m3u8 playback -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body {
            margin: 0;
            display: flex;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
        }
        #sidebar {
            width: 350px;
            background-color: #1e1e1e;
            border-right: 1px solid #333;
            display: flex;
            flex-direction: column;
        }
        #sidebar-header {
            padding: 20px;
            background-color: #252525;
            border-bottom: 1px solid #333;
        }
        #title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        #sidebar-header h2 {
            margin: 0;
            font-size: 1.2rem;
        }
        /* Cast / AirPlay controls */
        #cast-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        #cast-btn {
            display: none; /* shown once the Cast SDK loads */
            background: none;
            border: none;
            padding: 2px;
            cursor: pointer;
            color: #ffffff;           /* icon color when not casting */
        }
        #cast-btn svg {
            width: 28px;
            height: 28px;
            fill: currentColor;
        }
        #cast-btn.no-devices { opacity: 0.4; }
        #cast-btn.connected  { color: #4da3ff; } /* icon color while casting */
        #cast-btn .connected-fill { display: none; }
        #cast-btn.connected .connected-fill { display: inline; }
        #airplay-btn {
            display: none; /* shown only in Safari when an AirPlay device is found */
            background: #333;
            color: #e0e0e0;
            border: 1px solid #444;
            border-radius: 4px;
            padding: 4px 8px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        #cast-status {
            font-size: 0.8rem;
            color: #4da3ff;
            margin-bottom: 10px;
            min-height: 1em;
        }
        #playlist-filter {
            width: 95%;
            padding: 8px;
            margin-bottom: 10px;
            border-radius: 4px;
            border: 1px solid #444;
            background: #333;
            color: white;
            cursor: pointer;
        }
        #search {
            width: 90%;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #444;
            background: #333;
            color: white;
        }
        #guide {
            flex-grow: 1;
            overflow-y: auto;
            padding: 10px;
        }
        .channel-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            min-width: 0;
            text-align: left;
            background: #2a2a2a;
            color: #e0e0e0;
            border: 1px solid #333;
            padding: 10px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            font: inherit;
        }
        .channel-btn:hover {
            background: #3a3a3a;
        }
        .channel-btn.active {
            background: #0078d7;
            color: white;
            border-color: #005a9e;
        }
        /* Channel logo (light chip so dark logos stay visible) */
        .ch-logo {
            width: 48px;
            height: 34px;
            flex-shrink: 0;
            border-radius: 4px;
            background: #f0f0f0;
            object-fit: contain;
            padding: 2px;
            box-sizing: border-box;
        }
        .ch-logo.placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #3a3a3a;
            color: #bbb;
            font-weight: bold;
            font-size: 0.95rem;
        }
        .ch-text {
            flex: 1;
            min-width: 0;
        }
        .ch-name, .ch-now, .ch-next {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .ch-name { font-weight: 600; }
        .ch-now  { font-size: 0.85rem; color: #d0d0d0; margin-top: 3px; }
        .ch-next { font-size: 0.78rem; color: #8f8f8f; margin-top: 2px; }
        .ch-now:empty, .ch-next:empty { display: none; }
        .ch-progress {
            height: 3px;
            margin-top: 5px;
            background: #444;
            border-radius: 2px;
            overflow: hidden;
        }
        .ch-progress > span {
            display: block;
            height: 100%;
            width: 0;
            background: #4da3ff;
        }
        .channel-btn.active .ch-now,
        .channel-btn.active .ch-next { color: rgba(255, 255, 255, 0.85); }
        .channel-btn.active .ch-progress { background: rgba(255, 255, 255, 0.3); }
        .channel-btn.active .ch-progress > span { background: #fff; }
        #guide-info {
            font-size: 0.75rem;
            color: #777;
            margin-top: 8px;
        }
        #player-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
            padding: 20px;
        }
        video {
            width: 100%;
            max-width: 1280px;
            aspect-ratio: 16 / 9;
            background-color: #0a0a0a;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        /* ---------- Phone layout: video first, channel list slides out ---------- */
        #menu-btn, #fs-btn, #close-menu, #backdrop { display: none; }
        .icon-btn svg { width: 24px; height: 24px; fill: currentColor; }

        @media (max-width: 800px), (max-height: 500px) {
            body {
                display: block;
                height: 100dvh;
                overflow: hidden;
            }
            #player-container {
                position: fixed;
                inset: 0;
                padding: 0;
            }
            video {
                width: 100%;
                height: 100%;
                max-width: none;
                aspect-ratio: auto;
                object-fit: contain;
                background: #000;
                box-shadow: none;
            }
            #sidebar {
                position: fixed;
                top: 0;
                left: 0;
                bottom: 0;
                width: min(360px, 88vw);
                z-index: 20;
                transform: translateX(-105%);
                transition: transform 0.25s ease;
                box-shadow: 4px 0 20px rgba(0, 0, 0, 0.6);
            }
            body.menu-open #sidebar { transform: none; }

            #backdrop {
                display: block;
                position: fixed;
                inset: 0;
                z-index: 15;
                background: rgba(0, 0, 0, 0.5);
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.25s;
            }
            body.menu-open #backdrop { opacity: 1; pointer-events: auto; }

            /* Small round buttons floating over the video */
            #menu-btn, #fs-btn {
                display: flex;
                align-items: center;
                justify-content: center;
                position: fixed;
                top: max(12px, env(safe-area-inset-top));
                z-index: 10;
                width: 44px;
                height: 44px;
                border-radius: 50%;
                border: none;
                background: rgba(0, 0, 0, 0.55);
                color: #fff;
                cursor: pointer;
                transition: opacity 0.4s;
            }
            #menu-btn { left: max(12px, env(safe-area-inset-left)); }
            #fs-btn   { right: max(12px, env(safe-area-inset-right)); }
            /* Fade out while watching; any tap brings them back */
            body.idle #menu-btn, body.idle #fs-btn,
            body.menu-open #menu-btn, body.menu-open #fs-btn {
                opacity: 0;
                pointer-events: none;
            }

            #close-menu {
                display: flex;
                background: none;
                border: none;
                color: #e0e0e0;
                padding: 2px;
                cursor: pointer;
            }
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <div id="sidebar-header">
            <div id="title-row">
                <h2>Channel Guide</h2>
                <div id="cast-controls">
                    <!-- Chromecast button (rendered by the Cast SDK) -->
                    <button id="cast-btn" title="Cast to TV" aria-label="Cast to TV">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M21 3H3c-1.1 0-2 .9-2 2v3h2V5h18v14h-7v2h7c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM1 18v3h3c0-1.66-1.34-3-3-3zm0-4v2c2.76 0 5 2.24 5 5h2c0-3.87-3.13-7-7-7zm0-4v2c4.97 0 9 4.03 9 9h2c0-6.08-4.93-11-11-11z"/>
                            <path class="connected-fill" d="M19 7H5v1.63c3.96 1.28 7.09 4.41 8.37 8.37H19V7z"/>
                        </svg>
                    </button>
                    <!-- AirPlay button (Safari only) -->
                    <button id="airplay-btn" title="AirPlay">AirPlay</button>
                    <!-- Close button for the slide-out menu (phones only) -->
                    <button id="close-menu" class="icon-btn" title="Hide channels" aria-label="Hide channels">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                    </button>
                </div>
            </div>
            <div id="cast-status"></div>
            <select id="playlist-filter" onchange="changePlaylist()">
                <option value="https://iptv-org.github.io/iptv/countries/us.m3u">All US Channels</option>
                <option value="https://iptv-org.github.io/iptv/subdivisions/us-fl.m3u">Local: Florida</option>
                <option value="https://iptv-org.github.io/iptv/subdivisions/us-al.m3u">Local: Alabama</option>
                <option value="https://iptv-org.github.io/iptv/categories/news.m3u">Category: Global News</option>
                <option value="https://iptv-org.github.io/iptv/categories/sports.m3u">Category: Global Sports</option>
            </select>
            <input type="text" id="search" placeholder="Search channels or shows..." oninput="filterChannels()">
            <div id="guide-info"></div>
        </div>
        <div id="guide">
            <p style="text-align: center; color: #888;">Loading playlist...</p>
        </div>
    </div>

    <div id="player-container">
        <video id="video" controls playsinline x-webkit-airplay="allow"></video>
    </div>

    <!-- Phone-only controls over the video -->
    <div id="backdrop"></div>
    <button id="menu-btn" class="icon-btn" title="Channels" aria-label="Show channels">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
    </button>
    <button id="fs-btn" class="icon-btn" title="Full screen" aria-label="Full screen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path id="fs-icon" d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
    </button>

    <script>
        let playlistUrl = document.getElementById('playlist-filter').value;

        const guideDiv = document.getElementById('guide');
        const video = document.getElementById('video');
        const castStatus = document.getElementById('cast-status');
        let hls = null;
        let allChannels = [];
        let currentChannel = null;   // the channel the user last picked
        let castContext = null;      // set once the Cast SDK loads
        let guide = { channels: {}, logos: {} }; // TV listings, filled by loadGuide()
        let renderedRows = [];       // rows on screen, so Now/Next can refresh in place

        // Safari exposes this when AirPlay is possible
        const supportsAirPlay = !!window.WebKitPlaybackTargetAvailabilityEvent;

        // ---------- Playlist ----------

        function changePlaylist() {
            playlistUrl = document.getElementById('playlist-filter').value;
            allChannels = [];
            guideDiv.innerHTML = '<p style="text-align: center; color: #888;">Loading playlist...</p>';
            loadPlaylist();
        }

        async function loadPlaylist() {
            try {
                const response = await fetch(playlistUrl);
                const text = await response.text();
                const lines = text.split('\n');

                let parsing = null;

                for (let line of lines) {
                    line = line.trim();
                    if (line.startsWith('#EXTINF:')) {
                        // Attributes like tvg-id="ABC.us@East" tvg-logo="..."
                        const attrs = {};
                        for (const m of line.matchAll(/([\w-]+)="([^"]*)"/g)) attrs[m[1]] = m[2];
                        // The name is after the first comma that follows the attributes
                        const lastQuote = line.lastIndexOf('"');
                        const commaIndex = line.indexOf(',', lastQuote === -1 ? 0 : lastQuote);
                        const name = commaIndex !== -1 ? line.substring(commaIndex + 1).trim() : 'Unknown';
                        parsing = {
                            name: name || 'Unknown',
                            id: attrs['tvg-id'] || '',
                            logo: attrs['tvg-logo'] || ''
                        };
                    } else if (line && !line.startsWith('#') && parsing) {
                        parsing.url = line;
                        allChannels.push(parsing);
                        parsing = null;
                    }
                }
                renderGuide(allChannels);
            } catch (error) {
                guideDiv.innerHTML = '<p style="color: red; padding: 10px;">Failed to load playlist. Check console.</p>';
                console.error("Error fetching playlist:", error);
            }
        }

        function renderGuide(channels) {
            guideDiv.innerHTML = '';
            renderedRows = [];
            if (!channels.length) {
                guideDiv.innerHTML = '<p style="text-align: center; color: #888;">No channels match.</p>';
                return;
            }
            channels.forEach((channel) => {
                const container = document.createElement('div');
                container.style.display = 'flex';
                container.style.marginBottom = '8px';

                // 1. Channel button: plays locally, or on the TV if casting
                const btn = document.createElement('button');
                btn.className = 'channel-btn';
                btn.style.marginBottom = '0';
                btn.style.flexGrow = '1';

                btn.appendChild(makeLogo(channel));

                const text = document.createElement('div');
                text.className = 'ch-text';
                const nameEl = document.createElement('div');
                nameEl.className = 'ch-name';
                nameEl.textContent = channel.name;
                const nowEl = document.createElement('div');
                nowEl.className = 'ch-now';
                const barEl = document.createElement('div');
                barEl.className = 'ch-progress';
                barEl.appendChild(document.createElement('span'));
                const nextEl = document.createElement('div');
                nextEl.className = 'ch-next';
                text.append(nameEl, nowEl, barEl, nextEl);
                btn.appendChild(text);

                const row = { channel, nowEl, nextEl, barEl };
                renderedRows.push(row);
                updateRow(row);

                if (currentChannel && currentChannel.url === channel.url) {
                    btn.classList.add('active');
                }
                btn.onclick = () => {
                    document.querySelectorAll('.channel-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    selectChannel(channel);
                };

                // 2. Android VLC button
                const vlcBtn = document.createElement('a');
                vlcBtn.textContent = 'VLC';
                vlcBtn.style.marginLeft = '8px';
                vlcBtn.style.backgroundColor = '#ff8800';
                vlcBtn.style.color = 'white';
                vlcBtn.style.fontWeight = 'bold';
                vlcBtn.style.borderRadius = '6px';
                vlcBtn.style.textDecoration = 'none';
                vlcBtn.style.display = 'flex';
                vlcBtn.style.alignItems = 'center';
                vlcBtn.style.justifyContent = 'center';
                vlcBtn.style.padding = '0 15px';

                try {
                    const urlObj = new URL(channel.url);
                    const scheme = urlObj.protocol.replace(':', '');
                    const hostAndPath = urlObj.host + urlObj.pathname + urlObj.search;
                    vlcBtn.href = `intent://${hostAndPath}#Intent;action=android.intent.action.VIEW;scheme=${scheme};type=video/*;package=org.videolan.vlc;end;`;
                } catch (e) {
                    console.error("Invalid URL format:", channel.url);
                    vlcBtn.href = '#';
                }

                container.appendChild(btn);
                container.appendChild(vlcBtn);
                guideDiv.appendChild(container);
            });
        }

        // Search matches the channel name or what's on now
        function filterChannels() {
            const query = document.getElementById('search').value.trim().toLowerCase();
            const filtered = !query ? allChannels : allChannels.filter(c => {
                if (c.name.toLowerCase().includes(query)) return true;
                const info = nowNext(c);
                return !!(info && info.now && info.now[2].toLowerCase().includes(query));
            });
            renderGuide(filtered);
        }

        // ---------- TV guide (Now / Next) ----------

        // guide.json is rebuilt by a GitHub Action. On GitHub Pages, read it from
        // raw.githubusercontent.com so updates show up without waiting for Pages to redeploy.
        function guideUrls() {
            const urls = [];
            const host = location.hostname;
            const repo = location.pathname.split('/').filter(Boolean)[0];
            if (host.endsWith('.github.io') && repo && !repo.endsWith('.html')) {
                const owner = host.split('.')[0];
                urls.push(`https://raw.githubusercontent.com/${owner}/${repo}/main/guide.json`);
            }
            urls.push('guide.json');
            return urls;
        }

        async function loadGuide() {
            for (const url of guideUrls()) {
                try {
                    const res = await fetch(url, { cache: 'no-cache' });
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    const data = await res.json();
                    guide = { channels: data.channels || {}, logos: data.logos || {}, updated: data.updated };
                    const updated = guide.updated ? new Date(guide.updated) : null;
                    document.getElementById('guide-info').textContent = updated
                        ? `Guide updated ${updated.toLocaleString([], { weekday: 'short', hour: 'numeric', minute: '2-digit' })}`
                        : '';
                    if (allChannels.length) filterChannels(); // redraw with logos and listings
                    return;
                } catch (err) {
                    console.warn(`Guide not available from ${url}:`, err.message);
                }
            }
        }

        // Returns { now, next } programmes for a channel, or null if there's no listing.
        // Each programme is [startSeconds, stopSeconds, title, subtitle?]
        function nowNext(channel) {
            const list = channel.id && guide.channels[channel.id];
            if (!list) return null;
            const t = Date.now() / 1000;
            const i = list.findIndex(p => p[1] > t); // first programme that hasn't ended
            if (i === -1) return null;
            const now = list[i][0] <= t ? list[i] : null;
            const next = now ? list[i + 1] : list[i];
            return { now, next };
        }

        function formatTime(seconds) {
            return new Date(seconds * 1000).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
        }

        function updateRow(row) {
            const info = nowNext(row.channel);
            const bar = row.barEl.firstChild;
            if (!info) {
                row.nowEl.textContent = '';
                row.nextEl.textContent = '';
                row.barEl.style.display = 'none';
                return;
            }
            const { now, next } = info;
            if (now) {
                row.nowEl.textContent = now[3] ? `${now[2]} · ${now[3]}` : now[2];
                const pct = ((Date.now() / 1000 - now[0]) / (now[1] - now[0])) * 100;
                bar.style.width = `${Math.min(100, Math.max(0, pct))}%`;
                row.barEl.style.display = 'block';
            } else {
                row.nowEl.textContent = '';
                row.barEl.style.display = 'none';
            }
            row.nextEl.textContent = next ? `Next ${formatTime(next[0])} · ${next[2]}` : '';
        }

        function makeLogo(channel) {
            // Try the guide's logo, then the playlist's, then fall back to a letter
            const sources = [...new Set([channel.id && guide.logos[channel.id], channel.logo].filter(Boolean))];
            const placeholder = () => {
                const ph = document.createElement('div');
                ph.className = 'ch-logo placeholder';
                ph.textContent = (channel.name.match(/[A-Za-z0-9]/) || ['?'])[0].toUpperCase();
                return ph;
            };
            if (!sources.length) return placeholder();
            const img = document.createElement('img');
            img.className = 'ch-logo';
            img.loading = 'lazy';
            img.alt = '';
            img.referrerPolicy = 'no-referrer';
            let attempt = 0;
            img.onerror = () => {
                attempt++;
                if (attempt < sources.length) img.src = sources[attempt];
                else img.replaceWith(placeholder());
            };
            img.src = sources[0];
            return img;
        }

        // Keep Now/Next and progress bars current
        setInterval(() => renderedRows.forEach(updateRow), 60 * 1000);

        // Decide where a picked channel should play
        function selectChannel(channel) {
            currentChannel = channel;
            if (isCompact()) closeMenu(); // get the list out of the way on phones
            if (getCastSession()) {
                castChannel(channel);
            } else {
                playStream(channel.url);
            }
        }

        // ---------- Local playback ----------

        function stopLocal() {
            if (hls) {
                hls.destroy();
                hls = null;
            }
            video.pause();
            video.removeAttribute('src');
            video.load();
        }

        function playStream(url) {
            stopLocal();

            const nativeHls = video.canPlayType('application/vnd.apple.mpegurl');

            // In Safari, use native HLS so AirPlay can hand the stream to the Apple TV.
            // (AirPlay can't send an hls.js / MediaSource stream.)
            if (supportsAirPlay && nativeHls) {
                video.src = url;
                video.addEventListener('loadedmetadata', () => {
                    video.play().catch(e => console.log("Autoplay prevented", e));
                }, { once: true });
            } else if (Hls.isSupported()) {
                hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.play().catch(e => console.log("Autoplay prevented", e));
                });
                hls.on(Hls.Events.ERROR, function (event, data) {
                    if (data.fatal) {
                        console.error('Stream error:', data);
                    }
                });
            } else if (nativeHls) {
                video.src = url;
                video.addEventListener('loadedmetadata', () => {
                    video.play().catch(e => console.log("Autoplay prevented", e));
                }, { once: true });
            }
        }

        // ---------- Chromecast ----------

        function getCastSession() {
            return castContext ? castContext.getCurrentSession() : null;
        }

        async function castChannel(channel) {
            const session = getCastSession();
            if (!session) return;

            stopLocal(); // don't download the stream twice

            const mediaInfo = new chrome.cast.media.MediaInfo(channel.url, 'application/x-mpegurl');
            mediaInfo.streamType = chrome.cast.media.StreamType.LIVE;
            // Most iptv-org streams use MPEG-TS segments
            mediaInfo.hlsSegmentFormat = chrome.cast.media.HlsSegmentFormat.TS;
            mediaInfo.hlsVideoSegmentFormat = chrome.cast.media.HlsVideoSegmentFormat.MPEG2_TS;

            const metadata = new chrome.cast.media.GenericMediaMetadata();
            metadata.title = channel.name;
            const info = nowNext(channel);
            if (info && info.now) metadata.subtitle = info.now[2];
            const logo = (channel.id && guide.logos[channel.id]) || channel.logo;
            if (logo) metadata.images = [new chrome.cast.Image(logo)];
            mediaInfo.metadata = metadata;

            const request = new chrome.cast.media.LoadRequest(mediaInfo);
            request.autoplay = true;

            const device = session.getCastDevice().friendlyName;
            castStatus.textContent = `Loading ${channel.name} on ${device}...`;
            try {
                await session.loadMedia(request);
                castStatus.textContent = `Casting ${channel.name} to ${device}`;
            } catch (err) {
                console.error('Cast load failed:', err);
                castStatus.textContent = `${channel.name} won't play on the TV. Try another channel.`;
            }
        }

        // Called by the Cast SDK when it finishes loading
        window['__onGCastApiAvailable'] = function(isAvailable) {
            if (!isAvailable) return;

            castContext = cast.framework.CastContext.getInstance();
            castContext.setOptions({
                receiverApplicationId: chrome.cast.media.DEFAULT_MEDIA_RECEIVER_APP_ID,
                autoJoinPolicy: chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED
            });

            const castBtn = document.getElementById('cast-btn');
            castBtn.style.display = 'block';

            // Keep the icon in sync: dim = no TV found, white = ready, blue = casting
            const CS = cast.framework.CastState;
            function updateCastButton(state) {
                castBtn.classList.toggle('no-devices', state === CS.NO_DEVICES_AVAILABLE);
                castBtn.classList.toggle('connected', state === CS.CONNECTED || state === CS.CONNECTING);
            }
            updateCastButton(castContext.getCastState());
            castContext.addEventListener(
                cast.framework.CastContextEventType.CAST_STATE_CHANGED,
                (e) => updateCastButton(e.castState)
            );

            castBtn.onclick = async () => {
                const state = castContext.getCastState();
                if (state === CS.NO_DEVICES_AVAILABLE) {
                    castStatus.textContent = 'No TV found. Make sure you\'re on the same Wi-Fi and Chrome is allowed to find Nearby devices.';
                    return;
                }
                if (state === CS.CONNECTED) {
                    castContext.endCurrentSession(true); // stop casting
                    return;
                }
                try {
                    await castContext.requestSession(); // opens the device picker
                } catch (err) {
                    if (err !== 'cancel') console.error('Cast session failed:', err);
                }
            };

            castContext.addEventListener(
                cast.framework.CastContextEventType.SESSION_STATE_CHANGED,
                (event) => {
                    const S = cast.framework.SessionState;
                    if (event.sessionState === S.SESSION_STARTED) {
                        // Hand whatever is playing over to the TV
                        if (currentChannel) {
                            castChannel(currentChannel);
                        } else {
                            castStatus.textContent = 'Connected. Pick a channel to cast.';
                        }
                    } else if (event.sessionState === S.SESSION_RESUMED) {
                        castStatus.textContent = 'Connected to TV.';
                    } else if (event.sessionState === S.SESSION_ENDED) {
                        castStatus.textContent = '';
                        // Resume on this device
                        if (currentChannel) playStream(currentChannel.url);
                    }
                }
            );
        };

        // ---------- AirPlay (Safari) ----------

        if (supportsAirPlay) {
            const airplayBtn = document.getElementById('airplay-btn');
            video.addEventListener('webkitplaybacktargetavailabilitychanged', (e) => {
                airplayBtn.style.display = e.availability === 'available' ? 'block' : 'none';
            });
            airplayBtn.onclick = () => video.webkitShowPlaybackTargetPicker();
        }

        // ---------- Phone layout: slide-out menu, fading buttons, fullscreen ----------

        const compactQuery = window.matchMedia('(max-width: 800px), (max-height: 500px)');
        function isCompact() { return compactQuery.matches; }

        function openMenu() {
            document.body.classList.add('menu-open');
        }
        function closeMenu() {
            document.body.classList.remove('menu-open');
            wake();
        }
        document.getElementById('menu-btn').onclick = openMenu;
        document.getElementById('close-menu').onclick = closeMenu;
        document.getElementById('backdrop').onclick = closeMenu;
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeMenu();
        });

        // Start with the list open on phones, since nothing is playing yet
        if (isCompact()) openMenu();

        // Hide the floating buttons after 3 seconds of no touches while a video plays
        let idleTimer = null;
        function wake() {
            document.body.classList.remove('idle');
            clearTimeout(idleTimer);
            idleTimer = setTimeout(() => {
                if (!video.paused && !document.body.classList.contains('menu-open')) {
                    document.body.classList.add('idle');
                }
            }, 3000);
        }
        ['pointerdown', 'pointermove', 'keydown'].forEach(type =>
            document.addEventListener(type, wake, { passive: true })
        );
        video.addEventListener('play', wake);
        video.addEventListener('pause', wake);

        // Fullscreen for the whole page (not just the video), so the menu button
        // keeps working. Also turns the phone to landscape where allowed.
        const fsBtn = document.getElementById('fs-btn');
        const fsIcon = document.getElementById('fs-icon');
        const FS_ENTER = 'M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z';
        const FS_EXIT = 'M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z';
        if (!document.fullscreenEnabled) {
            fsBtn.remove(); // iPhones don't allow page fullscreen
        } else {
            fsBtn.onclick = async () => {
                try {
                    if (document.fullscreenElement) {
                        await document.exitFullscreen();
                    } else {
                        await document.documentElement.requestFullscreen({ navigationUI: 'hide' });
                        if (screen.orientation && screen.orientation.lock) {
                            screen.orientation.lock('landscape').catch(() => {});
                        }
                    }
                } catch (err) {
                    console.warn('Fullscreen failed:', err);
                }
            };
            document.addEventListener('fullscreenchange', () => {
                const pageFull = document.fullscreenElement === document.documentElement;
                fsIcon.setAttribute('d', pageFull ? FS_EXIT : FS_ENTER);
                fsBtn.title = pageFull ? 'Exit full screen' : 'Full screen';
                if (!document.fullscreenElement && screen.orientation && screen.orientation.unlock) {
                    screen.orientation.unlock();
                }
            });
        }

        // If the Cast SDK never loads (e.g. Samsung Internet, Firefox), say why
        setTimeout(() => {
            if (!castContext && !supportsAirPlay) {
                castStatus.textContent = 'To cast to a TV, open this page in Chrome.';
            }
        }, 4000);

        loadPlaylist();
        loadGuide();
        // Pick up the twice-daily guide refresh if the page is left open
        setInterval(loadGuide, 3 * 60 * 60 * 1000);
    </script>

    <!-- Google Cast SDK: loaded last so the callback above is already defined -->
    <script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
</body>
</html>
