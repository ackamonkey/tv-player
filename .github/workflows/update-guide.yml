name: Update TV guide

on:
  schedule:
    # Every day at 5:17 AM Eastern (09:17 UTC) and again at 5:17 PM
    - cron: '17 9,21 * * *'
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-guide
  cancel-in-progress: false

jobs:
  guide:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out this repo
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Get the iptv-org guide grabber
        run: |
          git clone --depth 1 https://github.com/iptv-org/epg.git epg
          cd epg
          npm install --no-audit --no-fund

      - name: Pick a guide source for each channel
        run: node scripts/build-guide.mjs channels

      - name: Download listings (one site at a time)
        working-directory: epg
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          mkdir -p ../work/guides
          ok=0; failed=""
          for f in ../work/channels/*.channels.xml; do
            site=$(basename "$f" .channels.xml)
            echo "::group::$site"
            # 15-minute limit per site; a crash or hang only skips that site
            if timeout 900 npm run grab --- --channels="$f" --output="../work/guides/$site.xml" --days=2 --maxConnections=3 --timeout=15000; then
              ok=$((ok+1))
            else
              failed="$failed $site"
              rm -f "../work/guides/$site.xml"
            fi
            echo "::endgroup::"
          done
          echo "Sites downloaded: $ok"
          if [ -n "$failed" ]; then echo "::warning::Sites that failed:$failed"; fi

      - name: Build guide.json
        run: node scripts/build-guide.mjs json

      - name: Save guide.json to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add guide.json
          if git diff --cached --quiet; then
            echo "Guide unchanged"
          else
            git commit -m "Update TV guide"
            git push
          fi
